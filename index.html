<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cronograma Vale do Silício — Mario Trentim</title>
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent: #0f172a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #f1f5f9;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  .header { text-align: center; padding: 32px 0 12px; }
  .header-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
  .header h1 { font-size: 26px; font-weight: 800; line-height: 1.15; color: var(--accent); }
  .header-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }

  /* Stats */
  .stats { display: flex; justify-content: center; gap: 28px; padding: 14px 0 20px; }
  .stat-value { font-size: 24px; font-weight: 800; }
  .stat-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }

  /* Day pills */
  .day-pills { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 14px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill {
    padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 12px; font-weight: 700; white-space: nowrap; min-width: 56px;
    transition: all 0.15s; font-family: inherit;
  }

  /* Filters */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 12px; }
  .filters select {
    font-size: 11px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-secondary);
    cursor: pointer; font-family: inherit;
  }
  .clear-btn {
    font-size: 11px; padding: 5px 10px; border-radius: 6px; border: none;
    background: #fee2e2; color: #dc2626; cursor: pointer; font-weight: 600; font-family: inherit;
  }

  /* Day info */
  .day-info { border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .day-info-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .day-info-emoji { font-size: 24px; }
  .day-info-title { font-weight: 800; font-size: 15px; }
  .day-info-subtitle { font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .day-info-logistics { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .day-events { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
  .day-event {
    display: flex; gap: 8px; align-items: center; font-size: 11px;
    padding: 5px 8px; border-radius: 5px; flex-wrap: wrap;
  }
  .day-event-time { font-weight: 700; color: var(--text-secondary); min-width: 72px; }
  .day-event-name { color: var(--text); font-weight: 600; }
  .day-event-loc { color: var(--text-muted); margin-left: auto; white-space: nowrap; font-size: 10px; }

  /* Content cards */
  .cards { display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; cursor: pointer; transition: all 0.2s; position: relative;
  }
  .card.key-content { border-width: 2px; }
  .card.checked { opacity: 0.5; }
  .card-inner { display: flex; align-items: flex-start; gap: 10px; }
  .checkbox {
    width: 22px; height: 22px; min-width: 22px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px; transition: all 0.2s;
  }
  .checkbox.unchecked { border: 2px solid #cbd5e1; }
  .checkbox.is-checked { background: #10b981; }
  .checkbox .checkmark { color: #fff; font-size: 13px; font-weight: 700; }
  .card-body { flex: 1; min-width: 0; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-bottom: 5px; }
  .tag {
    font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
    white-space: nowrap; letter-spacing: 0.02em;
  }
  .card-title {
    font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 4px; line-height: 1.35;
  }
  .card-title.done { text-decoration: line-through; }
  .card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-muted); }

  /* Day separator */
  .day-separator {
    display: flex; align-items: center; gap: 10px; padding: 14px 0 6px;
  }
  .day-separator-line { flex: 1; height: 1px; background: var(--border); }
  .day-separator-label { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }

  /* Legend */
  .legend { border-top: 1px solid var(--border); padding: 16px 0 28px; }
  .legend-title { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .legend-tags { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Empty */
  .empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

  /* Progress bar */
  .progress-wrap { padding: 0 0 16px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #10b981; border-radius: 3px; transition: width 0.4s ease; }
  .progress-label { font-size: 10px; color: var(--text-muted); margin-top: 4px; text-align: right; }

  @media (max-width: 480px) {
    .header h1 { font-size: 22px; }
    .stats { gap: 20px; }
    .stat-value { font-size: 20px; }
    .day-event { flex-direction: column; align-items: flex-start; gap: 2px; }
    .day-event-loc { margin-left: 0; }
    .card-meta { font-size: 10px; }
  }
</style>
</head>
<body>

// State
let state = {
  selectedDay: null,
  filterType: null,
  filterPriority: null,
  checked: JSON.parse(localStorage.getItem('sv_checked') || '{}'),
};

function saveChecked() {
  localStorage.setItem('sv_checked', JSON.stringify(state.checked));
}

function toggleCheck(idx) {
  state.checked[idx] = !state.checked[idx];
  saveChecked();
  render();
}

function setDay(d) { state.selectedDay = d; render(); }
function setFilterType(v) { state.filterType = v || null; render(); }
function setFilterPriority(v) { state.filterPriority = v || null; render(); }
function clearFilters() { state.filterType = null; state.filterPriority = null; render(); }

function getFiltered() {
  return CONTENTS.map((c,i) => ({...c, _idx:i})).filter(c => {
    if (state.selectedDay !== null && c.day !== state.selectedDay) return false;
    if (state.filterType && c.type !== state.filterType) return false;
    if (state.filterPriority && c.priority !== state.filterPriority) return false;
    return true;
  });
}

function getStats() {
  const total = CONTENTS.length;
  const must = CONTENTS.filter(c => c.priority === 'must').length;
  const done = Object.keys(state.checked).filter(k => state.checked[k]).length;
  return {total, must, done};
}

function eventBg(type) {
  if (type === 'evento') return '#dbeafe';
  if (type === 'gravacao') return '#fef3c7';
  return '#f1f5f9';
}

function render() {
  const filtered = getFiltered();
  const stats = getStats();
  const ad = state.selectedDay !== null ? DAYS[state.selectedDay] : null;
  const pct = stats.total > 0 ? Math.round((stats.done / stats.total) * 100) : 0;

  let html = '';

  // Header
  html += `<div class="header">
    <div class="header-eyebrow">Cronograma de Conteúdo</div>
    <h1>Vale do Silício 🇺🇸</h1>
    <div class="header-sub">Mario Trentim · 11–17 Mai 2026</div>
  </div>`;

  // Stats
  html += `<div class="stats">
    <div style="text-align:center"><div class="stat-value" style="color:#475569">${stats.total}</div><div class="stat-label">Total</div></div>
    <div style="text-align:center"><div class="stat-value" style="color:#dc2626">${stats.must}</div><div class="stat-label">Obrigatórios</div></div>
    <div style="text-align:center"><div class="stat-value" style="color:#10b981">${stats.done}</div><div class="stat-label">Gravados</div></div>
  </div>`;

  // Progress
  html += `<div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${pct}% concluído</div>
  </div>`;

  // Day pills
  html += `<div class="day-pills">`;
  html += `<button class="day-pill" style="background:${state.selectedDay===null?'#0f172a':'#f1f5f9'};color:${state.selectedDay===null?'#fff':'#64748b'}" onclick="setDay(null)">Todos</button>`;
  DAYS.forEach(d => {
    html += `<button class="day-pill" style="background:${state.selectedDay===d.id?d.color:'#f1f5f9'};color:${state.selectedDay===d.id?'#fff':'#64748b'}" onclick="setDay(${d.id})">${d.emoji} ${d.date.split(' ')[0]}</button>`;
  });
  html += `</div>`;

  // Filters
  html += `<div class="filters">`;
  html += `<select onchange="setFilterType(this.value)"><option value="">Todos os formatos</option>`;
  Object.entries(CONTENT_TYPES).forEach(([k,v]) => {
    html += `<option value="${k}" ${state.filterType===k?'selected':''}>${v.icon} ${v.label}</option>`;
  });
  html += `</select>`;
  html += `<select onchange="setFilterPriority(this.value)"><option value="">Todas prioridades</option>
    <option value="must" ${state.filterPriority==='must'?'selected':''}>🔴 Obrigatório</option>
    <option value="nice" ${state.filterPriority==='nice'?'selected':''}>⚪ Desejável</option></select>`;
  if (state.filterType || state.filterPriority) {
    html += `<button class="clear-btn" onclick="clearFilters()">✕ Limpar</button>`;
  }
  html += `</div>`;

  // Day info
  if (ad) {
    html += `<div class="day-info" style="background:${ad.color}0a;border:1px solid ${ad.color}30">
      <div class="day-info-header">
        <span class="day-info-emoji">${ad.emoji}</span>
        <div><div class="day-info-title" style="color:${ad.color}">${ad.date}</div>
        <div class="day-info-subtitle">${ad.subtitle}</div></div>
      </div>
      <div class="day-info-logistics">${ad.logistics}</div>`;
    if (ad.events.length) {
      html += `<div class="day-events">`;
      ad.events.forEach(ev => {
        html += `<div class="day-event" style="background:${eventBg(ev.type)}">
          <span class="day-event-time">${ev.time}</span>
          <span class="day-event-name">${ev.name}</span>
          <span class="day-event-loc">📍${ev.location}</span>
        </div>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }

  // Cards
  html += `<div class="cards">`;
  if (filtered.length === 0) {
    html += `<div class="empty">Nenhum conteúdo com esses filtros.</div>`;
  }

  let lastDay = -1;
  filtered.forEach(item => {
    const ct = CONTENT_TYPES[item.type];
    const pl = PILLARS[item.pillar];
    const isKey = item.title.includes('🔑') || item.title.includes('⭐');
    const isChecked = !!state.checked[item._idx];

    // Day separator when showing all
    if (state.selectedDay === null && item.day !== lastDay) {
      const d = DAYS[item.day];
      html += `<div class="day-separator">
        <span class="day-separator-label">${d.emoji} ${d.date} — ${d.subtitle}</span>
        <div class="day-separator-line"></div>
      </div>`;
      lastDay = item.day;
    }

    html += `<div class="card ${isKey?'key-content':''} ${isChecked?'checked':''}" style="${isKey?'border-color:'+ct.color+';box-shadow:0 2px 8px '+ct.color+'22':''}" onclick="toggleCheck(${item._idx})">
      <div class="card-inner">
        <div class="checkbox ${isChecked?'is-checked':'unchecked'}">
          ${isChecked?'<span class="checkmark">✓</span>':''}
        </div>
        <div class="card-body">
          <div class="card-tags">
            <span class="tag" style="background:${ct.bg};color:${ct.color}">${ct.icon} ${ct.label}</span>
            ${pl?`<span class="tag" style="background:${pl.color}18;color:${pl.color}">${pl.label}</span>`:''}
            <span class="tag" style="background:${item.priority==='must'?'#dc2626':'#e2e8f0'};color:${item.priority==='must'?'#fff':'#475569'}">${item.priority==='must'?'OBRIGATÓRIO':'DESEJÁVEL'}</span>
          </div>
          <div class="card-title ${isChecked?'done':''}">${item.title}</div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-meta">
            ${item.duration && item.duration !== '—' ? `<span>⏱ ${item.duration}</span>` : ''}
            <span>📍 ${item.where}</span>
          </div>
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;

  // Legend
  html += `<div class="legend">
    <div class="legend-title">Pilares de conteúdo</div>
    <div class="legend-tags">`;
  Object.entries(PILLARS).forEach(([k,v]) => {
    html += `<span class="tag" style="background:${v.color}15;color:${v.color};font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px">${v.label}</span>`;
  });
  html += `</div></div>`;

  document.getElementById('app').innerHTML = html;
}

render();
</script>
</body>
</html>
